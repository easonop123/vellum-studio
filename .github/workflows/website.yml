name: Website

on:
  push:
    paths-ignore: ["editor/**", "reference/**", "**/*.md", ".github/workflows/editor.yml"]
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint and types
        run: npx eslint . && npx next typegen && npx tsc --noEmit
      - name: Webhook unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Browser
        run: npx playwright install --with-deps chromium
      - name: Smoke tests (phone + desktop)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
