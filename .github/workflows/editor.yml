name: Vellum Editor (Mac app)

# Tests the editor on Linux and macOS, builds "Vellum Editor.app" on an Apple Silicon
# runner, checks the built app can make an edit, and wraps it in a .dmg.
# Every push to main attaches the .dmg to a GitHub Release.

on:
  push:
    branches: [main, "claude/**"]
    paths: ["editor/**", ".github/workflows/editor.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editor-${{ github.ref }}
  cancel-in-progress: true

env:
  MODEL_URL: https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2net_human_seg.onnx
  MODEL_PATH: editor/vellum_editor/assets/models/u2net_human_seg.onnx

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: editor/requirements.txt
      - name: System packages (ffmpeg, Qt display libraries)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Person model (cached)
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_PATH }}
          key: u2net-human-seg-v1
      - name: Download the person model if needed
        run: test -f "$MODEL_PATH" || curl -fsSL --retry 3 --create-dirs -o "$MODEL_PATH" "$MODEL_URL"
      - name: Install
        run: pip install -r editor/requirements.txt
      - name: Tests
        working-directory: editor
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  mac:
    needs: test-linux
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: editor/requirements.txt
      - name: Static ffmpeg for Apple Silicon (cached)
        uses: actions/cache@v4
        with:
          path: editor/vellum_editor/assets/bin
          key: ffmpeg-macos-arm64-v1
      - name: Download ffmpeg if needed
        run: test -x editor/vellum_editor/assets/bin/ffmpeg || bash editor/packaging/fetch_ffmpeg.sh editor/vellum_editor/assets/bin
      - name: Person model (cached)
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_PATH }}
          key: u2net-human-seg-v1
      - name: Download the person model if needed
        run: test -f "$MODEL_PATH" || curl -fsSL --retry 3 --create-dirs -o "$MODEL_PATH" "$MODEL_URL"
      - name: Install
        run: pip install -r editor/requirements.txt "pyinstaller>=6.6"
      - name: Version
        working-directory: editor
        run: echo "VERSION=$(python -c 'import vellum_editor; print(vellum_editor.__version__)')" >> "$GITHUB_ENV"
      - name: Tests on macOS, with the ffmpeg that ships in the app
        working-directory: editor
        env:
          VELLUM_FFMPEG: ${{ github.workspace }}/editor/vellum_editor/assets/bin/ffmpeg
          VELLUM_FFPROBE: ${{ github.workspace }}/editor/vellum_editor/assets/bin/ffprobe
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: App icon
        working-directory: editor
        run: |
          python packaging/make_icon.py packaging/icon.iconset
          iconutil -c icns packaging/icon.iconset -o packaging/icon.icns
      - name: Build Vellum Editor.app
        working-directory: editor
        run: pyinstaller --noconfirm --clean packaging/vellum_editor.spec --distpath dist --workpath build
      - name: Check the built app makes an edit (no window)
        working-directory: editor
        run: |
          du -sh "dist/Vellum Editor.app"
          "dist/Vellum Editor.app/Contents/MacOS/Vellum Editor" --selftest
      - name: Make the .dmg
        working-directory: editor
        run: bash packaging/make_dmg.sh "dist/Vellum Editor.app" "dist/Vellum-Editor.dmg"
      - name: Keep the .dmg with this run
        uses: actions/upload-artifact@v4
        with:
          name: Vellum-Editor-${{ env.VERSION }}-build${{ github.run_number }}
          path: editor/dist/Vellum-Editor.dmg
          retention-days: 14
      - name: Release (pushes to main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: editor-v${{ env.VERSION }}-build${{ github.run_number }}
          name: Vellum Editor ${{ env.VERSION }} (build ${{ github.run_number }})
          make_latest: true
          files: editor/dist/Vellum-Editor.dmg
          body: |
            **Download `Vellum-Editor.dmg` below**, open it, and drag Vellum Editor into Applications.

            First time only: right-click Vellum Editor in Applications and choose **Open**.
            If macOS still refuses, open **System Settings → Privacy & Security**, scroll down, and click **Open Anyway**.

            Built from ${{ github.sha }}.
